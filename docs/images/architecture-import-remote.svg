<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" width="1120" height="340"
     font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933">
  <title>Import into a remote repository</title>
  <desc>The importers of the Workbench read CSV files of a Collector, a Prometheus server or other data and write into a remote repository, for example ClickHouse, which the analysis queries.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#3b4652"/>
    </marker>
    <style>
      .zone      { fill: #f6f7f9; stroke: #9aa5b1; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .zoneLabel { font-size: 12px; font-weight: bold; fill: #52606d; letter-spacing: 0.6px; }
      .workbench { fill: #e4eef9; stroke: #3f72a8; stroke-width: 1.5; }
      .part      { fill: #ffffff; stroke: #3f72a8; stroke-width: 1.3; }
      .collector { fill: #dff1e1; stroke: #2f7d3b; stroke-width: 1.6; }
      .store     { fill: #fdf0cf; stroke: #a87b12; stroke-width: 1.5; }
      .storeLine { fill: none; stroke: #a87b12; stroke-width: 1.5; }
      .host      { fill: #ffffff; stroke: #6b7682; stroke-width: 1.3; }
      .title     { font-size: 15px; font-weight: bold; }
      .sub       { fill: #47525e; }
      .flow      { fill: none; stroke: #3b4652; stroke-width: 1.6; marker-end: url(#arrow); }
      .flowLabel { font-size: 11.5px; font-style: italic; fill: #3b4652; }
    </style>
  </defs>
  <rect x="0" y="0" width="1120" height="340" fill="#ffffff"/>
  <rect class="zone" x="20" y="20" width="280" height="300" rx="10"/>
  <text class="zoneLabel" x="36" y="43">IMPORTED DATA</text>
  <rect class="store" x="48" y="66" width="236" height="66" rx="3"/>
  <rect class="store" x="42" y="60" width="236" height="66" rx="3"/>
  <rect class="store" x="36" y="54" width="236" height="66" rx="3"/>
  <text class="title" x="154.0" y="84" text-anchor="middle">CSV files</text>
  <text class="sub" x="154.0" y="104" text-anchor="middle">of an external Collector</text>
  <rect class="host" x="36" y="140" width="248" height="78" rx="6"/>
  <text class="title" x="160.0" y="166" text-anchor="middle">Prometheus server</text>
  <text class="sub" x="160.0" y="188" text-anchor="middle">a selected interval</text>
  <text class="sub" x="160.0" y="204" text-anchor="middle">of its history</text>
  <rect class="host" x="36" y="226" width="248" height="78" rx="6"/>
  <text class="title" x="160.0" y="252" text-anchor="middle">Other data</text>
  <text class="sub" x="160.0" y="274" text-anchor="middle">OWID, Binance,</text>
  <text class="sub" x="160.0" y="290" text-anchor="middle">Yahoo Finance</text>
  <rect class="zone" x="380" y="20" width="320" height="300" rx="10"/>
  <text class="zoneLabel" x="396" y="43">ANALYST WORKSTATION</text>
  <rect class="workbench" x="398" y="54" width="284" height="250" rx="8"/>
  <text class="title" x="414" y="79">Workbench</text>
  <rect class="part" x="420" y="90" width="240" height="88" rx="6"/>
  <text class="title" x="540.0" y="130" text-anchor="middle">Importers</text>
  <text class="sub" x="540.0" y="152" text-anchor="middle">Collector CSV, Prometheus, ...</text>
  <rect class="part" x="420" y="198" width="240" height="88" rx="6"/>
  <text class="title" x="540.0" y="238" text-anchor="middle">Analysis</text>
  <text class="sub" x="540.0" y="260" text-anchor="middle">explorer, charts, bookmarks, export</text>
  <path class="flow" d="M284,93 H332 V110 H418"/>
  <path class="flow" d="M284,179 H332 V134 H418"/>
  <path class="flow" d="M284,265 H350 V158 H418"/>
  <path class="store" d="M860,96 a105.0,12 0 0 1 210,0 v166 a105.0,12 0 0 1 -210,0 z"/>
  <path class="storeLine" d="M860,96 a105.0,12 0 0 0 210,0"/>
  <text class="title" x="965.0" y="174" text-anchor="middle">Remote repository</text>
  <text class="sub" x="965.0" y="194" text-anchor="middle">for example ClickHouse,</text>
  <text class="sub" x="965.0" y="212" text-anchor="middle">Solr or Elasticsearch</text>
  <path class="flow" d="M660,134 H858"/>
  <text class="flowLabel" x="780" y="126" text-anchor="middle">writes</text>
  <path class="flow" d="M860,242 H662"/>
  <text class="flowLabel" x="780" y="234" text-anchor="middle">queries</text>
</svg>
