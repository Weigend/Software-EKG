<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" width="1120" height="340"
     font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933">
  <title>An external Collector and CSV files</title>
  <desc>An external Collector reads the measured systems and writes CSV files on its host. The files are copied to the workstation, imported into the embedded Solr and analysed there.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#3b4652"/>
    </marker>
    <style>
      .zone      { fill: #f6f7f9; stroke: #9aa5b1; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .zoneLabel { font-size: 12px; font-weight: bold; fill: #52606d; letter-spacing: 0.6px; }
      .workbench { fill: #e4eef9; stroke: #3f72a8; stroke-width: 1.5; }
      .part      { fill: #ffffff; stroke: #3f72a8; stroke-width: 1.3; }
      .collector { fill: #dff1e1; stroke: #2f7d3b; stroke-width: 1.6; }
      .store     { fill: #fdf0cf; stroke: #a87b12; stroke-width: 1.5; }
      .storeLine { fill: none; stroke: #a87b12; stroke-width: 1.5; }
      .host      { fill: #ffffff; stroke: #6b7682; stroke-width: 1.3; }
      .title     { font-size: 15px; font-weight: bold; }
      .sub       { fill: #47525e; }
      .flow      { fill: none; stroke: #3b4652; stroke-width: 1.6; marker-end: url(#arrow); }
      .flowLabel { font-size: 11.5px; font-style: italic; fill: #3b4652; }
    </style>
  </defs>
  <rect x="0" y="0" width="1120" height="340" fill="#ffffff"/>
  <rect class="zone" x="20" y="20" width="280" height="300" rx="10"/>
  <text class="zoneLabel" x="36" y="43">MEASURED SYSTEMS</text>
  <rect class="host" x="36" y="54" width="248" height="78" rx="6"/>
  <text class="title" x="160.0" y="80" text-anchor="middle">Linux / Unix hosts</text>
  <text class="sub" x="160.0" y="102" text-anchor="middle">SSH: top, iostat, df, log files</text>
  <text class="sub" x="160.0" y="118" text-anchor="middle">JVMs: JMX, Jolokia</text>
  <rect class="host" x="36" y="140" width="248" height="78" rx="6"/>
  <text class="title" x="160.0" y="166" text-anchor="middle">Windows hosts</text>
  <text class="sub" x="160.0" y="188" text-anchor="middle">performance counters,</text>
  <text class="sub" x="160.0" y="204" text-anchor="middle">Collector running on Windows</text>
  <rect class="host" x="36" y="226" width="248" height="78" rx="6"/>
  <text class="title" x="160.0" y="252" text-anchor="middle">Cloud / Kubernetes</text>
  <text class="sub" x="160.0" y="274" text-anchor="middle">Prometheus server:</text>
  <text class="sub" x="160.0" y="290" text-anchor="middle">HTTP API, PromQL, history</text>
  <rect class="zone" x="380" y="20" width="250" height="300" rx="10"/>
  <text class="zoneLabel" x="396" y="43">COLLECTOR HOST</text>
  <rect class="collector" x="398" y="54" width="214" height="110" rx="6"/>
  <text class="title" x="505.0" y="96" text-anchor="middle">External Collector</text>
  <text class="sub" x="505.0" y="118" text-anchor="middle">standalone process,</text>
  <text class="sub" x="505.0" y="134" text-anchor="middle">configured in YAML</text>
  <rect class="store" x="442" y="238" width="150" height="62" rx="3"/>
  <rect class="store" x="436" y="232" width="150" height="62" rx="3"/>
  <rect class="store" x="430" y="226" width="150" height="62" rx="3"/>
  <text class="title" x="505.0" y="254" text-anchor="middle">CSV files</text>
  <text class="sub" x="505.0" y="274" text-anchor="middle">logs/ekg/&lt;start time&gt;/</text>
  <path class="flow" d="M284,93 H396"/>
  <path class="flow" d="M284,179 H328 V118 H396"/>
  <path class="flow" d="M284,265 H346 V143 H396"/>
  <path class="flow" d="M505,164 V224"/>
  <text class="flowLabel" x="513" y="199" text-anchor="start">writes</text>
  <rect class="zone" x="730" y="20" width="370" height="300" rx="10"/>
  <text class="zoneLabel" x="746" y="43">ANALYST WORKSTATION</text>
  <rect class="workbench" x="746" y="54" width="338" height="250" rx="8"/>
  <text class="title" x="762" y="79">Workbench</text>
  <rect class="part" x="930" y="92" width="136" height="78" rx="6"/>
  <text class="title" x="998.0" y="118" text-anchor="middle">Analysis</text>
  <text class="sub" x="998.0" y="140" text-anchor="middle">explorer, charts,</text>
  <text class="sub" x="998.0" y="156" text-anchor="middle">bookmarks, export</text>
  <rect class="part" x="764" y="222" width="108" height="70" rx="6"/>
  <text class="title" x="818.0" y="254" text-anchor="middle">Importer</text>
  <text class="sub" x="818.0" y="274" text-anchor="middle">Collector CSV</text>
  <path class="store" d="M930,218 a68.0,12 0 0 1 136,0 v68 a68.0,12 0 0 1 -136,0 z"/>
  <path class="storeLine" d="M930,218 a68.0,12 0 0 0 136,0"/>
  <text class="title" x="998.0" y="256" text-anchor="middle">Embedded Solr</text>
  <text class="sub" x="998.0" y="276" text-anchor="middle">~/.ekg/solr</text>
  <path class="flow" d="M592,257 H762"/>
  <text class="flowLabel" x="677" y="235" text-anchor="middle">copy the files,</text>
  <text class="flowLabel" x="677" y="249" text-anchor="middle">then import</text>
  <path class="flow" d="M872,257 H928"/>
  <text class="flowLabel" x="900" y="249" text-anchor="middle">writes</text>
  <path class="flow" d="M998,206 V172"/>
  <text class="flowLabel" x="1006" y="193" text-anchor="start">queries</text>
</svg>
