
######################################################################################################################
#   Solr Cloud repository configuration for cluster monitoring
#   ZooKeeper ensemble: node1:2181, node2:2181, node3:2181
######################################################################################################################

# Auto-create Solr collection if it does not exist
io.softwareecg.collector.repository.rdb.autoCreateNoExistingRepository=false

# Solr collection name (must match the AWB project repository)
io.softwareecg.collector.repository.rdb.repositoryName=ekg

# Enable SolrCloud mode (resolve nodes via ZooKeeper)
io.softwareecg.collector.repository.rdb.isClusterMode=true

# ZooKeeper ensemble connection string
io.softwareecg.collector.repository.rdb.clusterManager=node1.cloud.local:2181,node2.cloud.local:2181,node3.cloud.local:2181

# Not used in cluster mode, but kept as fallback reference
io.softwareecg.collector.repository.rdb.databaseUrl=http://node1:8983/solr

# Authentication (adjust if Solr requires credentials)
io.softwareecg.collector.repository.rdb.user=admin
io.softwareecg.collector.repository.rdb.password=password

# Flush after 800 update events
io.softwareecg.collector.repository.rdb.commitMaxUpdateEvents=800

# Or flush after 1 minute, whichever comes first
io.softwareecg.collector.repository.rdb.commitTimeInterval=00:01:00

# Keep data for 999 days
io.softwareecg.collector.repository.rdb.dataMaxAgeInDays=999

# Use explicit commits
io.softwareecg.collector.repository.rdb.explicitCommit=true

# Enable daily compaction of time series
io.softwareecg.collector.repository.rdb.compactTimeSeries=true
io.softwareecg.collector.repository.rdb.compactIntervalStrategy=DailyCompactStrategy
