
##################################################################################################################
#                                                                                                                #
#   The base config properties used to setup the Software-EKG Collector                                          #
#                                                                                                                #
#   Be aware: this is one of many properties that can used to configure the collector.                           #
#             For example if the SolrRepositoryFactory is used as Collector repository                           #
#             than the remote-repository-config.properties will also required.                                   #
#                                                                                                                #
##################################################################################################################

# this property will not use until PSMG uses ArchiveStorage - to prevent errors we let this inside the config
io.softwareecg.collector.source.archiveDirectoryPattern=yyyyMMdd

#-----------------------------------------------------------------------------------------------------------------------
# Repository configuration
#-----------------------------------------------------------------------------------------------------------------------
# configuration of the storage - PSMG always uses Solr to write time series direct to target model
#io.softwareecg.collector.repository.RepositoryFactory=io.softwareecg.collector.repository.rdb.solr.SolrRepositoryFactory
io.softwareecg.collector.repository.RepositoryFactory=io.softwareecg.collector.repository.csv.CsvRepositoryFactory

#-----------------------------------------------------------------------------------------------------------------------
# Source Properties
#-----------------------------------------------------------------------------------------------------------------------
io.softwareecg.collector.source.wincount.WindowsPerformanceCounterAccess.UseBulkQuery=true


#-----------------------------------------------------------------------------------------------------------------------
# Progress ASCII sign
#-----------------------------------------------------------------------------------------------------------------------
io.softwareecg.collector.control.CollectorJob.UseProgressSign=false