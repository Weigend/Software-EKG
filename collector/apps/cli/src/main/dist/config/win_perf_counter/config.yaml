# Software-EKG collector - Windows performance counters of the machine the collector runs on.
# The counters are written with their English names; they are read on a Windows of every
# language. ${REF:procName} stands for the process of the job.

metricGroups:
  testcounter:
    type: win
    metrics:
      - metric: '\Process(${REF:procName})\*'
        wildcard: true
  mock:
    type: mock
    metrics:
      - ABC

processGroups:
  local:
    - name: _Total
    - name: java

hostGroups:
  local:
    hosts:
      - name: localhost
        address: 127.0.0.1

collectors:
  - type: remote
    metricGroup: testcounter
    processGroup: local
    hostGroup: local
    interval: 1s
  - type: remote
    metricGroup: mock
    processGroup: local
    hostGroup: local
    interval: 1s
