# A boolean flag that defines if the repository (index/collection) the the remote database
# like Apache Solr should created if not already exists.
io.softwareecg.collector.repository.rdb.autoCreateNoExistingRepository=false

# The name of the repository (ElasticSearch index / Solr Collection / Solr core) that have to use
# by the collector to store the time series data. This can also be the alias (used at Solr).
io.softwareecg.collector.repository.rdb.repositoryName=ekgdata

# A boolean flag that defines if the remote database should use via cluster mode or not.
# for example using Solr this will cause that the repository client will use Zookeeper to resolve an address
# of a Solr Cloud node to use instead using directly a specified Solr instance.
io.softwareecg.collector.repository.rdb.isClusterMode=false

# The connection string that can used to resolve/reach the remote database cluster manager.
# The connections string can be just hostname or hostname:port or any other that is database specific.
# For example at Apache Solr this should be "hostname:port" and points to the Zookeeper instance
io.softwareecg.collector.repository.rdb.clusterManager=localhost:9999

# The connection url to the remote database. The url should point to the query service of
# the database WITHOUT the index name itself.
# For example the url of the Apache Solr default service handler will be 'http://localhost:8983/solr'
# and the complete url including the index 'http://localhost:8983/solr/[indexName]'.
io.softwareecg.collector.repository.rdb.databaseUrl=http://localhost:8983/solr

# The username used to authenticate the service calls to the database.
io.softwareecg.collector.repository.rdb.user=admin

# The password used to authenticate the service calls to the database.
io.softwareecg.collector.repository.rdb.password=password

# The amount of series update/add events before the (in memory data) will
# flushed and committed to the configured remote database
io.softwareecg.collector.repository.rdb.commitMaxUpdateEvents=800

# The amount of time (time interval) after the time series data
# will flushed and committed to the configured remote database
# The time has to define in the format ##:##:## / hh:mm:ss
io.softwareecg.collector.repository.rdb.commitTimeInterval=00:01:00

# The a the amount of days the collector keep the time series data in the database.
# All data that is older and matches to the series meta data configured for this collector instance
# will be deleted after that time.
io.softwareecg.collector.repository.rdb.dataMaxAgeInDays=999

# A boolean flag that defines if the collector should use explicit commit commands after
# flush a chunk of time series data or if Autocommit features of the database should be used instead.
io.softwareecg.collector.repository.rdb.explicitCommit=true