#Define a new event
#io.softwareecg.collector.storage.solr.types.events.<EventName>
# .logRegex => is the regex to extract the values from the log line
# .logRegex.DateFormat => defines the date format for the date metricGroup
# .logRegex.ValueFormat => defines the value format (NUMERIC|'DATE-FORMAT')
#
# .logReader.LineStartPattern => defines the start of a log line to detect multi log lines

#Register event
#io.softwareecg.collector.storage.solr.types.events=<EventName>,<EventName2>

##########################
#Register event
io.softwareecg.collector.storage.solr.types.events=salesServiceBackend,salesDataStorageBackendImpl,logPerformanceEvent

########################## salesServiceBackend ##########################
io.softwareecg.collector.storage.solr.types.events.salesServiceBackend.logRegex=(?<xxLOGxx>(?s).*RemoteServicesBackendImpl.callMethod.*MethodCall:\\s(?<NAME>[A-Za-z]+).*Start:\\s(?<DATE>.*);\\sEnd:\\s(?<xxENDDATExx>.*);\\sDuration:\\s(?<VALUE>\\d:\\d{2}:\\d{2}.\\d{3}).*)
io.softwareecg.collector.storage.solr.types.events.salesServiceBackend.logRegex.DateFormat=yyyy-MM-dd HH:mm:ss.SSS
io.softwareecg.collector.storage.solr.types.events.salesServiceBackend.logRegex.ValueType=TIME
io.softwareecg.collector.storage.solr.types.events.salesServiceBackend.logRegex.ValueFormat=H:mm:ss.SSS
io.softwareecg.collector.storage.solr.types.events.salesServiceBackend.metricGroup=Sales Service Backend

########################## DataStorageBackendImpl ##########################
io.softwareecg.collector.storage.solr.types.events.salesDataStorageBackendImpl.logRegex=(?<xxLOGxx>(?s).*\\[\\s+(?<NAME>[A-Za-z.]+)\\s+\\].*Save:.*Start:\\s(?<DATE>.*);\\sEnd:\\s(?<xxENDDATExx>.*);\\sDuration:\\s(?<VALUE>\\d{1}:\\d{2}:\\d{2}.\\d{3}).*)
io.softwareecg.collector.storage.solr.types.events.salesDataStorageBackendImpl.logRegex.DateFormat=yyyy-MM-dd HH:mm:ss.SSS
io.softwareecg.collector.storage.solr.types.events.salesDataStorageBackendImpl.logRegex.ValueType=TIME
io.softwareecg.collector.storage.solr.types.events.salesDataStorageBackendImpl.logRegex.ValueFormat=H:mm:ss.SSS
io.softwareecg.collector.storage.solr.types.events.salesDataStorageBackendImpl.metricGroup=Sales Data Storage Backend


########################## LogPerformanceEvent ##########################
io.softwareecg.collector.storage.solr.types.events.logPerformanceEvent.logRegex=(?<xxPAYLOADxx>.*\\sPERF\\s(?<xxEVENTTYPExx>\\[I\\])\\s(?<NAME>[A-Za-z0-9.]+)\\s\\[(?<DATE>\\d{2}-\\d{2}-\\d{4}\\s\\d{2}:\\d{2}:\\d{2},\\d+);(?<xxENDDATExx>\\d{2}-\\d{2}-\\d{4}\\s\\d{2}:\\d{2}:\\d{2},\\d+);(?<VALUE>\\d+)\\])
io.softwareecg.collector.storage.solr.types.events.logPerformanceEvent.logRegex.DateFormat=dd-MM-yyyy HH:mm:ss,SSS
io.softwareecg.collector.storage.solr.types.events.logPerformanceEvent.logRegex.ValueType=NUMERIC
io.softwareecg.collector.storage.solr.types.events.logPerformanceEvent.logRegex.ValueFormat=0.0
io.softwareecg.collector.storage.solr.types.events.logPerformanceEvent.metricGroup=Sales Performance Event

##########################
#Register intervals
io.softwareecg.collector.storage.solr.types.intervals=psdhImportInterval

########################## psdhImportInterval ##########################
#2013-09-25 16:10:20,059 DEBUG Starting import of Motorformen...
io.softwareecg.collector.storage.solr.types.intervals.psdhImportInterval.logRegex.start=(?<xxStartLogxx>(?s)(?<DATE>\\d{4}-\\d{2}-\\d{2}\\s\\d{2}:\\d{2}:\\d{2},\\d{3})\\s.*Starting\\simport\\sof\\s(?<NAME>[A-Za-z]*)....*)
io.softwareecg.collector.storage.solr.types.intervals.psdhImportInterval.logRegex.end=(?<xxEndLogxx>(?s)(?<DATE>\\d{4}-\\d{2}-\\d{2}\\s\\d{2}:\\d{2}:\\d{2},\\d{3})\\s.*Starting\\s(import\\sof\\s(?<xxFOLLOWERxx>[A-Za-z]*)....*|.*))
io.softwareecg.collector.storage.solr.types.intervals.psdhImportInterval.logRegex.DateFormat=yyyy-MM-dd HH:mm:ss,SSS
io.softwareecg.collector.storage.solr.types.intervals.psdhImportInterval.metricGroup=PSDH-IMPORT


########################## Multi log line reader properties ##########################
io.softwareecg.collector.storage.solr.logReader.LineStartPattern=^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2},\\d{3}\\s.*

########################## Common solr storage properties ##########################
io.softwareecg.collector.storage.solr.dataMaxAge=80DAY
io.softwareecg.collector.storage.solr.commitMaxEventNumber=2
io.softwareecg.collector.storage.solr.commitTimeInterval=00:00:04
io.softwareecg.collector.storage.solr.serverUrl=http://localhost:8983/solr
io.softwareecg.collector.storage.solr.user=solrcollector
io.softwareecg.collector.storage.solr.password=password

########################## Common storage properties ##########################
io.softwareecg.collector.storage.projectName=sales-integration
io.softwareecg.collector.storage.solr.hardCommit=true



