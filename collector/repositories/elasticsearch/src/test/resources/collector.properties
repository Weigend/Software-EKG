#______________________________________________________________________________
#
# Backup Properties
#______________________________________________________________________________
#
#Backup Directory
#
#Hängt mit der Rollover frequency zusammen, welche aktuell im Code fest eingestellt ist; nur wenn ein
#Rollover durchgeführt wird, kann auch ein Backup passieren.
#Hier wird ein JavaSimpleDate Pattern eingegeben. Das Pattern gibt an, wie oft ein neues Verzeichnis für CSV Dateien durchgeführt wird, in welches dann die
#beim Rollover entstandenen Dateien verschoben werden.
#Beim Erzeugen eines neuen Verzeichnisses wird das letzte erzeugte Verzeichniss (welche im selben Collectordurchlauf erzeugt wurden) als
#.zip Datei gepackt (.tgz oder .tar.gz wird nicht unterstützt) und danach gelöscht.
#Beispiel 1 "YYYY'Kalenderwoche'w"  wird am 24.06.2013 auf "Kofigurierbares Logverzeichnis/ekg/Archiv/2013Kalenderwoche26" abgebildet => wöchentliches Zip
#Beispiel 2 "YYYYMMDDH"  wird am 24.06.2013 um 12 Uhr auf "Kofigurierbares Logverzeichnis/ekg/Archiv/2013062612" abgebildet => stündliches Zip
#ACHTUNG: unterschied h und H , HH wird auf 08 abgebildet, H nur auf 8
io.softwareecg.collector.source.archiveDirectoryPattern=yyyyMMdd

