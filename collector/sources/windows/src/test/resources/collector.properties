#______________________________________________________________________________
#
# Solr Storage Properties
#______________________________________________________________________________
#
#Define a new event
#io.softwareecg.collector.storage.solr.types.events.<EventName>
# .logRegex => is the regex to extract the values from the log line
# .logRegex.DateFormat => defines the date format for the date metricGroup
# .logRegex.ValueFormat => defines the value format (NUMERIC | INCREMENT |'DATE-FORMAT')
#
# .logReader.LineStartPattern => defines the start of a log line to detect multi log lines

#Register event
#io.softwareecg.collector.storage.solr.types.events=<EventName>,<EventName2>
#______________________________________________________________________________


##########################
#Register event
io.softwareecg.collector.storage.solr.types.events=salesServiceBackend,salesDataStorageBackendImpl

########################## salesServiceBackend ##########################
io.softwareecg.collector.storage.solr.types.events.salesServiceBackend.logRegex=(?<xxLOGxx>(?s).*RemoteServicesBackendImpl.callMethod.*MethodCall:\\s(?<NAME>[A-Za-z]+).*Start:\\s(?<DATE>.*);\\sEnd:\\s(?<xxENDDATExx>.*);\\sDuration:\\s(?<VALUE>.*)$)
io.softwareecg.collector.storage.solr.types.events.salesServiceBackend.logRegex.DateFormat=yyyy-MM-dd HH:mm:ss.SSS
io.softwareecg.collector.storage.solr.types.events.salesServiceBackend.logRegex.ValueType=TIME
io.softwareecg.collector.storage.solr.types.events.salesServiceBackend.logRegex.ValueFormat=h:mm:ss.SSS
io.softwareecg.collector.storage.solr.types.events.salesServiceBackend.metricGroup=Sales Service Backend


########################## DataStorageBackendImpl ##########################
io.softwareecg.collector.storage.solr.types.events.salesDataStorageBackendImpl.logRegex=(?<xxLOGxx>(?s).*\\[\\s+(?<NAME>[A-Za-z.]+)\\s+\\].*Save:.*Start:\\s(?<DATE>.*);\\sEnd:\\s(?<xxENDDATExx>.*);\\sDuration:\\s(?<VALUE>.*)$)
io.softwareecg.collector.storage.solr.types.events.salesDataStorageBackendImpl.logRegex.DateFormat=yyyy-MM-dd HH:mm:ss.SSS
io.softwareecg.collector.storage.solr.types.events.salesDataStorageBackendImpl.logRegex.ValueType=TIME
io.softwareecg.collector.storage.solr.types.events.salesDataStorageBackendImpl.logRegex.ValueFormat=h:mm:ss.SSS
io.softwareecg.collector.storage.solr.types.events.salesDataStorageBackendImpl.metricGroup=Sales Storage Backend


########################## Multi log line reader properties ##########################
io.softwareecg.collector.storage.solr.logReader.LineStartPattern=^\\d{4}-\\d{2}-\\d{2}\\s\\d{2}:\\d{2}:\\d{2}.\\d{3}\\s.*

########################## Common solr storage properties ##########################
io.softwareecg.collector.storage.solr.dataMaxAge=80DAY
io.softwareecg.collector.storage.solr.commitMaxEventNumber=200
io.softwareecg.collector.storage.solr.commitTimeInterval=00:30:00
io.softwareecg.collector.storage.solr.serverUrl=http://localhost:8983/solr
io.softwareecg.collector.storage.solr.user=solrcollector
io.softwareecg.collector.storage.solr.password=password

########################## Common storage properties ##########################
io.softwareecg.collector.storage.projectName=sales-integration
io.softwareecg.collector.storage.solr.hardCommit=false



