name: Build and Test

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    concurrency:
      group: build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
    - name: Check out Software-EKG
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Install Xvfb (virtual display for JavaFX tests)
      # Ubuntu runners are headless. Any JavaFX test that constructs a Stage,
      # Scene or instantiates a Toolkit needs an X server - xvfb-run starts an
      # in-memory one for the duration of the wrapped command.
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Install wfx into the local Maven repository
      # wfx is no longer part of the reactor. The script clones the public
      # Weigend/wfx repository at the tag matching <wfxVersion> from pom.xml
      # and installs it, so no credentials are needed here.
      run: ./install-wfx.sh

    - name: Build with Maven
      run: xvfb-run -a mvn -B clean verify

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/target/surefire-reports/*.xml'
        if-no-files-found: warn
        retention-days: 14
