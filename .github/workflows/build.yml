name: Build and Test

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    concurrency:
      group: build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
    - name: Check out Software-EKG
      uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Install Xvfb (virtual display for JavaFX tests)
      # Ubuntu runners are headless. Any JavaFX test that constructs a Stage,
      # Scene or instantiates a Toolkit needs an X server - xvfb-run starts an
      # in-memory one for the duration of the wrapped command.
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Install wfx into the local Maven repository
      # wfx is no longer part of the reactor. The script clones the public
      # Weigend/wfx repository at the tag matching <wfxVersion> from pom.xml
      # and installs it, so no credentials are needed here.
      run: ./install-wfx.sh

    - name: Build with Maven
      run: xvfb-run -a mvn -B clean verify

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results
        path: '**/target/surefire-reports/*.xml'
        if-no-files-found: warn
        retention-days: 14

  windows-counters:
    # The collector reads Windows performance counters through a native library (wpcaccess).
    # It is built here with the mingw-w64 of the runner and tested against the counters of the
    # runner; the Linux build above has nothing to test it with.
    name: Windows performance counters
    runs-on: windows-latest
    timeout-minutes: 30

    concurrency:
      group: windows-counters-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        shell: bash

    steps:
    - name: Check out Software-EKG
      uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Build the native library and test it
      # -Pwpc builds the library and makes a library that cannot be loaded a failure instead
      # of a reason to skip. Only the tests of the source "win" run; the modules it needs are
      # built without theirs.
      run: >
        mvn -B -Pwpc -pl collector/sources/windows -am verify
        -Dtest='Windows*Test' -Dsurefire.failIfNoSpecifiedTests=false

    - name: Upload the native library
      uses: actions/upload-artifact@v7
      with:
        name: wpcaccess-windows-x64
        path: collector/sources/windows/target/native/*.dll
        if-no-files-found: error
        retention-days: 14

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-windows-counters
        path: 'collector/sources/windows/target/surefire-reports/*'
        if-no-files-found: warn
        retention-days: 14
