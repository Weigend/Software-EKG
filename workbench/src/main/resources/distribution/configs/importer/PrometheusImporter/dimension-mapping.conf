#
# Dimension Mapping for Prometheus Labels
#
# Format: DIMENSION:label1;label2;label3
# The first matching label will be used to populate the dimension.
#
# Special mapping: Use "*host" to extract hostname from "host:port" format
# Special mapping: Use "*prefix" to derive from metric name prefix (e.g., jvm_, node_)
#

HOST_GROUP:role
HOST:*host;instance;host;node_name
NAMESPACE:kubernetes_namespace;namespace
SERVICE:servicename;kubernetes_name;MICROSERVICEID;MICROSERVICENAME
POD:pod_name;node
CONTAINER:container_name
MEASUREMENT:job
PROCESS:job
METRIC_GROUP:*prefix
METRIC_NAME:__name__