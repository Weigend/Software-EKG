<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="4mm" height="4mm" version="1.1"
     style="shape-rendering:geometricPrecision; text-rendering:geometricPrecision; image-rendering:optimizeQuality; fill-rule:evenodd; clip-rule:evenodd"
     viewBox="0 0 400 400"
>
 <defs>
  <style type="text/css">
   <![CDATA[
    .ch0 {fill:#FFCC00}
    .ch1 {fill:#FFCC00;opacity:0.7}
   ]]>
  </style>
 </defs>
 <g id="ClickHouse">
  <!-- ClickHouse logo: stylized columnar database -->
  <!-- Five vertical bars representing columnar storage -->
  <rect class="ch0" x="60"  y="60"  width="44" height="280" rx="6"/>
  <rect class="ch1" x="120" y="100" width="44" height="240" rx="6"/>
  <rect class="ch0" x="180" y="60"  width="44" height="280" rx="6"/>
  <rect class="ch1" x="240" y="120" width="44" height="220" rx="6"/>
  <rect class="ch0" x="300" y="60"  width="44" height="280" rx="6"/>
 </g>
</svg>
