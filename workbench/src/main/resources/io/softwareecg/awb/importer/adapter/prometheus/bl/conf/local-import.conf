# Prometheus Local Import Configuration
# ======================================
# This file configures the time range for local Prometheus imports.
# When importing to a local repository, time series data (values) are 
# fetched from Prometheus and stored in the local Solr repository.

# Import time range configuration
# -------------------------------
# Specifies how much historical data to import from Prometheus.
#
# Options:
#   - "all"          : Import all available data (uses Prometheus min_time/max_time)
#   - A number       : Import the last N hours of data
#
# Examples:
#   import.range = all      # Import everything available
#   import.range = 24       # Import last 24 hours
#   import.range = 168      # Import last 7 days (7 * 24)
#   import.range = 720      # Import last 30 days (30 * 24)
#   import.range = 8760     # Import last year (365 * 24)

import.range = 1
